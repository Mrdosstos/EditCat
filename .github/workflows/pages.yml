name: Testar, publicar e gerar APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Montar o site
        run: |
          mkdir -p _site
          cp dist/editcat.html _site/index.html
          cp dist/editcat.html _site/editcat.html
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: dist/editcat.html

  android:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: dist
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # ubuntu-latest already ships the Android SDK (ANDROID_HOME) with licenses accepted
      - name: Compilar APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../EditCat-${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: EditCat-apk
          path: EditCat-*.apk
      - name: Publicar versão de teste
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-${{ github.run_number }}" EditCat-${{ github.run_number }}.apk \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" --prerelease \
            --title "EditCat para Android (teste ${{ github.run_number }})" \
            --notes "APK de teste gerado a partir de ${{ github.sha }}. Todos os testes passaram antes desta compilação. Para instalar: baixe o arquivo .apk no celular e abra; permita instalar de fontes desconhecidas se o Android pedir."

  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
